<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단축키 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2b3a55;
    --ink:#2b2420;
    --ink-soft:#5a6478;
    --gold:#e8a33d;
    --correct:#3f9c62;
    --wrong:#d3555a;
    --page:#f6f4ee;
    --key-face:#fdfbf4;
    --key-shadow:#c7bfa8;
    --key-active:#e8a33d;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ height:100%; }
  body{
    margin:0;
    height: var(--app-height, 100vh);
    overflow:hidden;
    background: var(--page);
    font-family:'Gothic A1', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 16px 14px 14px;
    user-select:none;
  }

  .topbar{
    width:100%;
    max-width: 520px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 10px;
    flex-shrink:0;
  }
  .back-link{
    text-decoration:none;
    color: var(--ink-soft);
    font-weight:700;
    font-size:14px;
    background: white;
    padding: 7px 14px;
    border-radius: 20px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
  }
  .level-pill{
    font-family:'Jua', sans-serif;
    background: var(--gold);
    color: var(--ink);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
  }

  .app{
    width:100%;
    max-width: 520px;
    flex: 1;
    min-height: 0;
    max-height: 720px;
    display:flex;
    flex-direction:column;
    border-radius: 22px;
    overflow:hidden;
    box-shadow: 0 16px 34px rgba(0,0,0,0.18);
    background: white;
  }

  .mission-bar{
    background: var(--navy);
    color:white;
    padding: 14px 18px;
    display:flex;
    align-items:center;
    gap: 12px;
    flex-shrink:0;
  }
  .mission-bar .mission-text{
    flex:1;
    min-width:0;
    font-size: 14px;
    font-weight:700;
  }
  .mission-bar .mission-counter{
    font-family:'Jua', sans-serif;
    background: rgba(255,255,255,0.14);
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 13px;
    white-space:nowrap;
    flex-shrink:0;
  }

  .stage{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 26px;
    padding: 24px;
    background: linear-gradient(160deg, #fbf8f1, #f1ede2);
  }

  .action-label{
    font-family:'Jua', sans-serif;
    font-size: clamp(22px, 6vw, 30px);
    color: var(--ink);
    text-align:center;
  }
  .action-sub{
    font-size: 14px;
    color: var(--ink-soft);
    font-weight:600;
    margin-top: -14px;
    text-align:center;
  }

  .combo-row{
    display:flex;
    align-items:center;
    gap: 14px;
  }
  .keycap-wrap{
    position:relative;
  }
  .step-badge{
    position:absolute;
    top:-10px; left:-10px;
    width:22px; height:22px;
    border-radius:50%;
    background: var(--navy);
    color:white;
    font-family:'Jua', sans-serif;
    font-size: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .plus{
    font-family:'Jua', sans-serif;
    font-size: 26px;
    color: var(--ink-soft);
    transition: opacity .15s ease;
  }
  .arrow-hint{
    font-family:'Jua', sans-serif;
    font-size: 22px;
    color: var(--gold);
    width: 22px;
    text-align:center;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .arrow-hint.show{
    opacity: 1;
    animation: nudge 0.8s ease-in-out infinite;
  }
  @keyframes nudge{
    0%,100%{ transform: translateX(0); }
    50%{ transform: translateX(4px); }
  }

  .keycap{
    min-width: 96px;
    height: 96px;
    padding: 0 18px;
    border-radius: 16px;
    background: var(--key-face);
    border: 3px solid var(--key-shadow);
    box-shadow: 0 6px 0 var(--key-shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Jua', sans-serif;
    font-size: 26px;
    color: var(--ink);
    cursor:pointer;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .keycap:active, .keycap.pressed{
    transform: translateY(6px);
    box-shadow: 0 0 0 var(--key-shadow);
  }
  .keycap.armed{
    background: var(--key-active);
    border-color: #c07f22;
    box-shadow: 0 6px 0 #c07f22;
  }
  .keycap.hint-pulse{
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow: 0 6px 0 var(--key-shadow); }
    50%{ box-shadow: 0 6px 0 var(--key-shadow), 0 0 0 8px rgba(232,163,61,0.25); }
  }
  .keycap.shake{
    animation: keyShake .3s ease;
  }
  @keyframes keyShake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    75%{ transform: translateX(6px); }
  }

  .timer-ring{
    width: 10px;
  }

  .ring-wrap{
    position:relative;
    width: 64px;
    height: 64px;
    display:none;
  }
  .ring-wrap.show{ display:block; }
  .ring-wrap svg{ transform: rotate(-90deg); }
  .ring-bg{ fill:none; stroke:#e4dcc9; stroke-width:6; }
  .ring-fg{ fill:none; stroke: var(--gold); stroke-width:6; stroke-linecap:round; }
  .ring-fg.timeout{ stroke: var(--wrong); }

  .feedback{
    min-height: 22px;
    font-size: 14px;
    font-weight:700;
    color: var(--correct);
  }
  .feedback.wrong{ color: var(--wrong); }

  .hand-hint{
    font-size: 13px;
    color: var(--ink-soft);
    text-align:center;
    max-width: 320px;
    line-height:1.5;
  }

  .complete-screen{
    display:none;
    text-align:center;
    background: white;
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.18);
    max-width: 420px;
    width:100%;
    margin-top: 18px;
  }
  .complete-screen.show{ display:block; }
  .stamp{
    display:inline-block;
    border: 4px solid var(--correct);
    color: var(--correct);
    font-family:'Jua', sans-serif;
    font-size: 24px;
    padding: 7px 20px;
    border-radius: 8px;
    transform: rotate(-6deg);
    margin-bottom: 16px;
  }
  .complete-screen p{
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }
  .btn{
    font-family:'Gothic A1', sans-serif;
    font-weight:900;
    font-size: 15px;
    padding: 12px 24px;
    border-radius: 24px;
    border:none;
    cursor:pointer;
    background: var(--navy);
    color: white;
  }
  .app.hidden{ display:none; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="index.html">← 게시판으로</a>
  <span class="level-pill" id="levelPill">초보자</span>
</div>

<div class="app" id="app">
  <div class="mission-bar">
    <div class="mission-text" id="missionText">불러오는 중...</div>
    <div class="mission-counter" id="missionCounter">0 / 5</div>
  </div>

  <div class="stage">
    <div class="action-label" id="actionLabel">저장하기</div>
    <div class="action-sub" id="actionSub">문서를 다 썼으면 이 단축키로 저장해요</div>

    <div class="combo-row">
      <div class="keycap-wrap">
        <div class="step-badge">①</div>
        <div class="keycap" id="ctrlKey">Ctrl</div>
      </div>
      <div class="arrow-hint" id="arrowHint">→</div>
      <div class="plus" id="plusSign">+</div>
      <div class="keycap-wrap">
        <div class="step-badge">②</div>
        <div class="keycap" id="letterKey">S</div>
      </div>
      <div class="ring-wrap" id="ringWrap">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="ring-bg" cx="32" cy="32" r="26"></circle>
          <circle class="ring-fg" id="ringFg" cx="32" cy="32" r="26" stroke-dasharray="163" stroke-dashoffset="0"></circle>
        </svg>
      </div>
    </div>

    <div class="hand-hint">① Ctrl을 먼저 누르세요 → ② 그다음 글자를 누르세요<br>(두 손가락으로 동시에 눌러도 되고, 순서대로 하나씩 눌러도 돼요)</div>

    <div class="feedback" id="feedback"></div>
  </div>
</div>

<div class="complete-screen" id="completeScreen">
  <div class="stamp">완료!</div>
  <p>자주 쓰는 단축키를 손에 익혀봤어요.<br>실제 컴퓨터에서도 Ctrl 키를 누른 채로 시도해보세요.</p>
  <div class="avg-reaction" id="avgReaction" style="display:none; font-family:'Jua', sans-serif; font-size:18px; color:var(--navy); margin:-8px 0 20px;"></div>
  <button class="btn" onclick="restart()">다시 연습하기</button>
</div>

<script>
  function setAppHeight(){
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);

  const level = new URLSearchParams(location.search).get('level') || localStorage.getItem('oe_level') || 'beginner';
  const levelLabels = { beginner: '초보자', intermediate: '중급자', advanced: '고급자' };
  document.getElementById('levelPill').textContent = levelLabels[level] || '초보자';

  // key -> { name (Korean action), subs (varied real-world scenarios) }
  const KEY_INFO = {
    S: { name: '저장하기', subs: [
      '보고서를 다 썼어요. 저장해볼까요?',
      '이메일 초안을 저장해두세요',
      '사진 편집을 마쳤어요. 저장해보세요',
      '회의록 작성이 끝났어요. 저장하세요',
      '문서 수정을 마쳤으니 저장해두세요'
    ]},
    C: { name: '복사하기', subs: [
      '원본은 그대로 두고 내용을 복사해요',
      '이 문장을 다른 곳에도 써야 해요. 복사해보세요',
      '표를 그대로 옮기려면 먼저 복사하세요',
      '같은 내용을 여러 곳에 붙일 때 복사를 써요'
    ]},
    V: { name: '붙여넣기', subs: [
      '복사하거나 잘라낸 내용을 가져다 놓아요',
      '방금 복사한 내용을 여기에 붙여보세요',
      '옮겨온 내용을 문서에 넣어보세요'
    ]},
    X: { name: '잘라내기', subs: [
      '내용을 오려서 다른 곳으로 옮길 준비를 해요',
      '이 문단을 통째로 다른 곳으로 옮겨보세요',
      '잘못 넣은 내용을 오려서 옮겨보세요'
    ]},
    Z: { name: '실행 취소', subs: [
      '방금 한 작업을 하나 되돌려요',
      '실수로 지운 문장을 되살려보세요',
      '방금 누른 게 잘못됐어요! 되돌려보세요'
    ]},
    A: { name: '전체 선택', subs: [
      '화면에 있는 내용을 한 번에 다 선택해요',
      '문서 전체를 한 번에 골라보세요',
      '전부 옮기기 전에 먼저 전체 선택하세요'
    ]}
  };

  function pickSub(key){
    const subs = KEY_INFO[key].subs;
    return subs[Math.floor(Math.random() * subs.length)];
  }

  const levelSettings = {
    beginner:     { pool: ['S'],                         rounds: 5,  timed: false },
    intermediate: { pool: ['S', 'C', 'V', 'X'],           rounds: 8,  timed: false },
    advanced:     { pool: ['S', 'C', 'V', 'X', 'Z', 'A'], rounds: 10, timed: true  }
  };
  const settings = levelSettings[level] || levelSettings.beginner;

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Build a round list of target keys, avoiding the same key twice in a row
  // when the pool is big enough to allow it.
  function buildRounds(){
    const rounds = [];
    let last = null;
    for (let i = 0; i < settings.rounds; i++){
      let choices = settings.pool;
      if (choices.length > 1) choices = choices.filter(k => k !== last);
      const pick = choices[Math.floor(Math.random() * choices.length)];
      rounds.push(pick);
      last = pick;
    }
    return rounds;
  }

  let rounds = buildRounds();
  let current = 0;
  let armed = false;
  let armTimer = null;
  let ringTimer = null;
  let roundStartTime = null;
  let reactionTimes = [];
  let timeoutCount = 0;
  const RING_SECONDS = 4;
  const RING_CIRC = 163;

  const app = document.getElementById('app');
  const completeScreen = document.getElementById('completeScreen');
  const missionText = document.getElementById('missionText');
  const missionCounter = document.getElementById('missionCounter');
  const actionLabel = document.getElementById('actionLabel');
  const actionSub = document.getElementById('actionSub');
  const ctrlKeyEl = document.getElementById('ctrlKey');
  const letterKeyEl = document.getElementById('letterKey');
  const feedback = document.getElementById('feedback');
  const ringWrap = document.getElementById('ringWrap');
  const ringFg = document.getElementById('ringFg');
  const arrowHint = document.getElementById('arrowHint');

  function showRound(){
    missionCounter.textContent = current + ' / ' + rounds.length;
    if (current >= rounds.length){
      finishGame();
      return;
    }
    const key = rounds[current];
    const info = KEY_INFO[key];
    actionLabel.textContent = info.name;
    actionSub.textContent = pickSub(key);
    letterKeyEl.textContent = key;
    disarm();
    feedback.textContent = '';
    feedback.classList.remove('wrong');
    ctrlKeyEl.classList.add('hint-pulse');
    roundStartTime = Date.now();

    if (settings.timed){
      startRing();
    } else {
      ringWrap.classList.remove('show');
    }
  }

  function startRing(){
    ringWrap.classList.add('show');
    ringFg.classList.remove('timeout');
    ringFg.style.transition = 'none';
    ringFg.style.strokeDashoffset = '0';
    // force reflow so the transition below actually animates from 0
    void ringFg.getBoundingClientRect();
    ringFg.style.transition = `stroke-dashoffset ${RING_SECONDS}s linear`;
    ringFg.style.strokeDashoffset = String(RING_CIRC);
    clearTimeout(ringTimer);
    ringTimer = setTimeout(() => {
      // A real timeout, not a silent no-op: flash red, say so clearly, then
      // give a fresh ring for another try at the same key (still no penalty
      // to progress — but it's now an actual, acknowledged event).
      timeoutCount++;
      ringFg.classList.add('timeout');
      showWrong('시간 초과! 다시 한번 도전해봐요');
      setTimeout(() => {
        roundStartTime = Date.now();
        startRing();
      }, 500);
    }, RING_SECONDS * 1000);
  }

  function arm(){
    armed = true;
    ctrlKeyEl.classList.add('armed');
    ctrlKeyEl.classList.remove('hint-pulse');
    arrowHint.classList.add('show');
    clearTimeout(armTimer);
    armTimer = setTimeout(disarm, 3000);
  }

  function disarm(){
    armed = false;
    ctrlKeyEl.classList.remove('armed');
    arrowHint.classList.remove('show');
    clearTimeout(armTimer);
  }

  function nextRound(){
    clearTimeout(ringTimer);
    current++;
    showRound();
  }

  function succeed(){
    feedback.textContent = '정확해요! 👍';
    feedback.classList.remove('wrong');
    if (settings.timed && roundStartTime){
      reactionTimes.push(Date.now() - roundStartTime);
    }
    letterKeyEl.classList.add('pressed');
    setTimeout(() => letterKeyEl.classList.remove('pressed'), 150);
    setTimeout(nextRound, 350);
  }

  function showWrong(msg){
    feedback.textContent = msg;
    feedback.classList.add('wrong');
    letterKeyEl.classList.add('shake');
    setTimeout(() => letterKeyEl.classList.remove('shake'), 300);
  }

  function tryLetterPress(){
    if (armed){
      disarm();
      succeed();
    } else {
      showWrong('Ctrl을 먼저 눌러보세요');
      ctrlKeyEl.classList.add('hint-pulse');
    }
  }

  ctrlKeyEl.addEventListener('pointerdown', () => arm());
  letterKeyEl.addEventListener('pointerdown', () => tryLetterPress());

  // Real keyboard support (desktop). preventDefault so Ctrl+S etc. don't
  // trigger the browser's own save/print/etc. dialogs while practicing.
  document.addEventListener('keydown', (e) => {
    if (current >= rounds.length) return;
    const targetKey = rounds[current];
    if (!e.ctrlKey) return;
    e.preventDefault();
    const pressedKey = (e.key || '').toUpperCase();
    if (pressedKey === targetKey){
      disarm();
      succeed();
    } else if (pressedKey){
      showWrong(`Ctrl + ${pressedKey}는 지금 누를 키가 아니에요. Ctrl + ${targetKey}를 눌러보세요`);
    }
  });

  function finishGame(){
    clearTimeout(ringTimer);
    clearTimeout(armTimer);
    app.classList.add('hidden');
    completeScreen.classList.add('show');

    const avgReaction = document.getElementById('avgReaction');
    if (settings.timed && reactionTimes.length > 0){
      const avgSec = (reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length / 1000).toFixed(1);
      let text = `평균 반응 속도: ${avgSec}초`;
      if (timeoutCount > 0) text += ` (시간 초과 ${timeoutCount}번)`;
      avgReaction.textContent = text;
      avgReaction.style.display = 'block';
    } else {
      avgReaction.style.display = 'none';
    }

    requestAnimationFrame(() => completeScreen.scrollIntoView({ behavior: 'smooth', block: 'start' }));
  }

  function restart(){
    rounds = buildRounds();
    current = 0;
    reactionTimes = [];
    timeoutCount = 0;
    completeScreen.classList.remove('show');
    app.classList.remove('hidden');
    showRound();
  }

  showRound();
</script>

</body>
</html>
