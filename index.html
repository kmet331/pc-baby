<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컴맹 탈출 오피스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cork-dark:#4a3826;
    --cork-mid:#5c4632;
    --cork-light:#6b5540;
    --paper:#fbf6ea;
    --ink:#2b2420;
    --ink-soft:#5a4f42;
    --note-yellow:#f4d35e;
    --note-yellow-shadow:#c9a935;
    --note-sky:#5aa9e6;
    --note-sky-shadow:#3d84bd;
    --note-mint:#63c7a8;
    --note-mint-shadow:#3f9c81;
    --note-blush:#f0899a;
    --note-blush-shadow:#c95f72;
    --pin-metal:#c9c0b0;
    --gold:#e8a33d;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.15) 0, transparent 45%),
      repeating-radial-gradient(circle at 10% 10%, rgba(255,255,255,0.015) 0 2px, transparent 2px 6px),
      linear-gradient(160deg, var(--cork-mid), var(--cork-dark));
    font-family:'Gothic A1', sans-serif;
    color:var(--ink);
    padding: 28px 20px 60px;
  }

  .frame{
    max-width: 980px;
    margin: 0 auto;
  }

  header{
    text-align:center;
    margin-bottom: 34px;
  }

  .badge-hang{
    display:inline-block;
    background: var(--gold);
    color: var(--ink);
    font-family:'Jua', sans-serif;
    font-size: 15px;
    padding: 6px 18px;
    border-radius: 3px;
    transform: rotate(-2deg);
    box-shadow: 0 3px 0 rgba(0,0,0,0.2);
    margin-bottom: 18px;
  }

  h1{
    font-family:'Jua', sans-serif;
    font-size: clamp(32px, 6vw, 52px);
    color: var(--paper);
    margin: 0 0 10px;
    text-shadow: 0 3px 0 rgba(0,0,0,0.3);
    letter-spacing: 1px;
  }

  header p{
    color: #d8cdbc;
    font-size: 17px;
    margin: 0;
    font-weight: 500;
  }

  /* Level selector styled as a small memo strip pinned at top */
  .level-memo{
    background: var(--paper);
    max-width: 480px;
    margin: 26px auto 0;
    padding: 16px 20px;
    border-radius: 4px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    position: relative;
    text-align:center;
  }
  .level-memo::before{
    content:'';
    position:absolute;
    top:-9px; left:50%;
    transform: translateX(-50%);
    width:16px; height:16px;
    background: radial-gradient(circle at 35% 30%, #fff, var(--pin-metal) 70%);
    border-radius:50%;
    box-shadow: 0 2px 3px rgba(0,0,0,0.4);
  }
  .level-memo p{
    margin:0 0 10px;
    font-weight:700;
    font-size:14px;
    color: var(--ink-soft);
  }
  .level-tabs{
    display:flex;
    gap:8px;
    justify-content:center;
  }
  .level-tab{
    font-family:'Gothic A1', sans-serif;
    font-weight:900;
    font-size:15px;
    padding:9px 16px;
    border-radius: 20px;
    border: 2px solid transparent;
    background: #eee3cd;
    color: var(--ink-soft);
    cursor:pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .level-tab:hover{ transform: translateY(-2px); }
  .level-tab.active{
    background: var(--ink);
    color: var(--paper);
  }

  /* Board grid of sticky notes */
  .board{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 34px 28px;
    margin-top: 46px;
  }
  @media (max-width: 620px){
    .board{ grid-template-columns: 1fr; }
  }

  .note{
    position:relative;
    display:block;
    text-decoration:none;
    color: var(--ink);
    padding: 26px 22px 22px;
    border-radius: 3px;
    min-height: 168px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.12), 0 14px 22px rgba(0,0,0,0.35);
    transition: transform .15s ease, box-shadow .15s ease;
    cursor:pointer;
  }
  .note:hover{
    transform: translateY(-6px) rotate(0deg) !important;
    box-shadow: 0 16px 0 rgba(0,0,0,0.1), 0 22px 30px rgba(0,0,0,0.4);
  }
  .note:nth-child(1){ background: var(--note-yellow); transform: rotate(-2.5deg); }
  .note:nth-child(2){ background: var(--note-sky); transform: rotate(2deg); }
  .note:nth-child(3){ background: var(--note-mint); transform: rotate(1.5deg); }
  .note:nth-child(4){ background: var(--note-blush); transform: rotate(-1.5deg); }

  .note.disabled{
    cursor: default;
    filter: saturate(0.55) brightness(0.96);
  }
  .note.disabled:hover{
    transform: none !important;
    box-shadow: 0 10px 0 rgba(0,0,0,0.12), 0 14px 22px rgba(0,0,0,0.35);
  }

  .pin{
    position:absolute;
    top:-10px; left:50%;
    transform: translateX(-50%);
    width:18px; height:18px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--pin-metal) 75%);
    box-shadow: 0 3px 4px rgba(0,0,0,0.45);
  }

  .note-icon{
    font-size: 38px;
    line-height:1;
    margin-bottom: 10px;
    display:block;
  }
  .note-title{
    font-family:'Jua', sans-serif;
    font-size: 22px;
    margin: 0 0 6px;
  }
  .note-desc{
    font-size: 14px;
    font-weight: 500;
    color: rgba(0,0,0,0.62);
    line-height:1.5;
    margin: 0;
  }

  .stars{
    position:absolute;
    bottom: 16px;
    right: 18px;
    font-size: 16px;
    letter-spacing: 2px;
  }

  .soon-stamp{
    position:absolute;
    top: 16px; right: 14px;
    border: 3px solid rgba(0,0,0,0.45);
    color: rgba(0,0,0,0.5);
    font-family:'Jua', sans-serif;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 4px;
    transform: rotate(8deg);
  }

  footer{
    text-align:center;
    margin-top: 50px;
    color: #b9ac97;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="frame">
  <header>
    <span class="badge-hang">신입사원 적응 훈련</span>
    <h1>컴맹 탈출 오피스</h1>
    <p>게시판에서 오늘 연습할 게임을 하나 골라보세요</p>
  </header>

  <div class="level-memo">
    <p>난이도를 선택하세요</p>
    <div class="level-tabs" id="levelTabs">
      <button class="level-tab" data-level="beginner">초보자</button>
      <button class="level-tab" data-level="intermediate">중급자</button>
      <button class="level-tab" data-level="advanced">고급자</button>
    </div>
  </div>

  <div class="board">
    <a class="note" id="typingNote" href="messenger-typing.html">
      <span class="pin"></span>
      <span class="note-icon">💬</span>
      <h2 class="note-title">메신저 답장하기</h2>
      <p class="note-desc">동료가 보낸 단어를 그대로 답장으로 보내보세요</p>
      <span class="stars" id="typingStars">☆☆☆</span>
    </a>

    <a class="note disabled" id="fileNote">
      <span class="pin"></span>
      <span class="soon-stamp">준비중</span>
      <span class="note-icon">🗂️</span>
      <h2 class="note-title">파일 정리하기</h2>
      <p class="note-desc">폴더 만들기, 복사, 붙여넣기를 연습해요</p>
      <span class="stars">☆☆☆</span>
    </a>

    <a class="note disabled" id="shortcutNote">
      <span class="pin"></span>
      <span class="soon-stamp">준비중</span>
      <span class="note-icon">🎹</span>
      <h2 class="note-title">단축키 리듬</h2>
      <p class="note-desc">Ctrl+C, Ctrl+V를 리듬에 맞춰 눌러봐요</p>
      <span class="stars">☆☆☆</span>
    </a>

    <a class="note disabled" id="storyNote">
      <span class="pin"></span>
      <span class="soon-stamp">준비중</span>
      <span class="note-icon">📋</span>
      <h2 class="note-title">출근 첫날 미션</h2>
      <p class="note-desc">배운 걸 모두 모아 실전처럼 연습해요</p>
      <span class="stars">☆☆☆</span>
    </a>
  </div>

  <footer>Created by Myeongeun Kim(kmet331@gmail.com)</footer>
</div>

<script>
  // Level selection persists in localStorage and is passed to each game via query string
  const LEVEL_KEY = 'oe_level';
  const tabs = document.querySelectorAll('.level-tab');
  const savedLevel = localStorage.getItem(LEVEL_KEY) || 'beginner';

  function setLevel(level){
    localStorage.setItem(LEVEL_KEY, level);
    tabs.forEach(t => t.classList.toggle('active', t.dataset.level === level));
    document.getElementById('typingNote').href = `messenger-typing.html?level=${level}`;
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => setLevel(tab.dataset.level));
  });

  setLevel(savedLevel);

  // Show completion stars if the typing game has been finished before
  if (localStorage.getItem('oe_typing_done') === 'true') {
    document.getElementById('typingStars').textContent = '★★★';
  }
</script>

</body>
</html>
