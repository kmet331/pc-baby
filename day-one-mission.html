<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출근 첫날 미션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2b3a55;
    --ink:#2b2420;
    --ink-soft:#5a6478;
    --gold:#e8a33d;
    --correct:#3f9c62;
    --wrong:#d3555a;
    --page:#f6f4ee;
    --bubble-in:#ffffff;
    --bubble-out:#e8a33d;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ height:100%; }
  body{
    margin:0;
    height: var(--app-height, 100vh);
    overflow:hidden;
    background: var(--page);
    font-family:'Gothic A1', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 16px 14px 14px;
    user-select:none;
  }

  .topbar{
    width:100%;
    max-width: 520px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 10px;
    flex-shrink:0;
  }
  .back-link{
    text-decoration:none;
    color: var(--ink-soft);
    font-weight:700;
    font-size:14px;
    background: white;
    padding: 7px 14px;
    border-radius: 20px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
  }
  .day-pill{
    font-family:'Jua', sans-serif;
    background: var(--gold);
    color: var(--ink);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
  }

  .app{
    width:100%;
    max-width: 520px;
    flex: 1;
    min-height: 0;
    max-height: 760px;
    display:flex;
    flex-direction:column;
    border-radius: 22px;
    overflow:hidden;
    box-shadow: 0 16px 34px rgba(0,0,0,0.18);
    background: white;
  }

  .story-header{
    background: var(--navy);
    color:white;
    padding: 14px 18px;
    display:flex;
    align-items:center;
    gap: 12px;
    flex-shrink:0;
  }
  .story-header .avatar{
    width: 36px; height:36px;
    border-radius:50%;
    background: var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }
  .story-header .who{ flex:1; min-width:0; }
  .story-header .name{ font-family:'Jua', sans-serif; font-size:16px; }
  .story-header .status{ font-size:12px; color:#b9c2d6; }
  .story-header .counter{
    font-family:'Jua', sans-serif;
    background: rgba(255,255,255,0.14);
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 13px;
    white-space:nowrap;
  }

  .thread{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding: 16px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    background:
      radial-gradient(circle, rgba(0,0,0,0.03) 1px, transparent 1px) 0 0/16px 16px,
      #eef1f5;
  }

  .row{ display:flex; gap:8px; }
  .row.in{ justify-content:flex-start; }
  .row.out{ justify-content:flex-end; }
  .row.system{ justify-content:center; }

  .avatar-sm{
    width: 28px; height:28px;
    border-radius:50%;
    background:#dfe5ee;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    flex-shrink:0;
    margin-top: 4px;
  }
  .bubble{
    max-width: 80%;
    min-width:0;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height:1.5;
    font-weight:600;
  }
  .bubble.in{ background: var(--bubble-in); border-bottom-left-radius:4px; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
  .bubble.out{ background: var(--bubble-out); color:var(--ink); border-bottom-right-radius:4px; }
  .bubble.system{
    background: transparent;
    color: var(--ink-soft);
    font-size: 12.5px;
    text-align:center;
    font-weight:700;
    max-width:100%;
  }

  /* Active task area, pinned below the thread */
  .task-zone{
    flex-shrink:0;
    border-top: 1px solid rgba(0,0,0,0.06);
    padding: 14px 16px 16px;
    background: white;
  }
  .task-label{
    font-size: 12.5px;
    font-weight:700;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  /* typing task */
  .word-display{
    font-family:'Jua', sans-serif;
    font-size: clamp(20px, 5.5vw, 26px);
    margin-bottom: 10px;
    min-height: 30px;
  }
  .char{ color: rgba(0,0,0,0.28); }
  .char.correct{ color: var(--correct); }
  .char.wrong{ color: var(--wrong); text-decoration: underline wavy var(--wrong); }
  .char.current{ color: var(--ink); border-bottom: 3px solid var(--gold); }
  .input-row{ display:flex; gap:8px; }
  input#typeInput{
    flex:1;
    min-width:0;
    font-size: 16px;
    font-family:'Gothic A1', sans-serif;
    font-weight:700;
    padding: 11px 14px;
    border-radius: 20px;
    border: 2px solid #e4dcc9;
    outline:none;
    background: #fbf6ea;
    color: var(--ink);
  }
  input#typeInput:focus{ border-color: var(--gold); }

  /* choice task */
  .choice-grid{
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .choice-btn{
    font-family:'Gothic A1', sans-serif;
    font-weight:700;
    font-size: 15px;
    padding: 12px 16px;
    border-radius: 14px;
    border: 2px solid #e4dcc9;
    background: #fbf6ea;
    color: var(--ink);
    text-align:left;
    cursor:pointer;
  }
  .choice-btn:active{ background: #f1e6cd; }
  .choice-btn.correct{ border-color: var(--correct); background:#e7f5ec; }
  .choice-btn.wrong{ border-color: var(--wrong); background:#fbeaea; }

  /* shortcut task */
  .combo-row{ display:flex; align-items:center; justify-content:center; gap: 12px; margin-bottom: 8px; }
  .plus{ font-family:'Jua', sans-serif; font-size:20px; color:var(--ink-soft); }
  .keycap{
    min-width: 68px;
    height: 68px;
    padding: 0 12px;
    border-radius: 14px;
    background: #fdfbf4;
    border: 3px solid #c7bfa8;
    box-shadow: 0 5px 0 #c7bfa8;
    display:flex; align-items:center; justify-content:center;
    font-family:'Jua', sans-serif;
    font-size: 20px;
    color: var(--ink);
    cursor:pointer;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .keycap.armed{ background: var(--gold); border-color:#c07f22; box-shadow:0 5px 0 #c07f22; }
  .keycap.pressed{ transform: translateY(5px); box-shadow:0 0 0 #c7bfa8; }

  .continue-btn{
    display:block;
    width:100%;
    font-family:'Gothic A1', sans-serif;
    font-weight:900;
    font-size: 15px;
    padding: 13px 16px;
    border-radius: 20px;
    border:none;
    background: var(--navy);
    color:white;
    cursor:pointer;
  }

  .feedback{ min-height:18px; font-size:13px; font-weight:700; color:var(--correct); text-align:center; margin-top:6px; }
  .feedback.wrong{ color: var(--wrong); }

  .app.hidden{ display:none; }

  .complete-screen{
    display:none;
    text-align:center;
    background: white;
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.18);
    max-width: 420px;
    width:100%;
    margin-top: 18px;
  }
  .complete-screen.show{ display:block; }
  .stamp{
    display:inline-block;
    border: 4px solid var(--correct);
    color: var(--correct);
    font-family:'Jua', sans-serif;
    font-size: 24px;
    padding: 7px 20px;
    border-radius: 8px;
    transform: rotate(-6deg);
    margin-bottom: 16px;
  }
  .complete-screen p{ font-size: 15px; color: var(--ink-soft); margin-bottom: 22px; }
  .btn{
    font-family:'Gothic A1', sans-serif;
    font-weight:900;
    font-size: 15px;
    padding: 12px 24px;
    border-radius: 24px;
    border:none;
    cursor:pointer;
    background: var(--navy);
    color: white;
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="index.html">← 게시판으로</a>
  <span class="day-pill">출근 첫날</span>
</div>

<div class="app" id="app">
  <div class="story-header">
    <div class="avatar">🏢</div>
    <div class="who">
      <div class="name">신입사원 하루</div>
      <div class="status">오늘 배운 걸 다 모아서 써먹어봐요</div>
    </div>
    <div class="counter" id="counter">0 / 6</div>
  </div>

  <div class="thread" id="thread"></div>

  <div class="task-zone" id="taskZone"></div>
</div>

<div class="complete-screen" id="completeScreen">
  <div class="stamp">첫날 완료!</div>
  <p>파일 열기, 타이핑, 저장, 복사·붙여넣기까지<br>오늘 배운 걸 전부 실전처럼 써봤어요. 수고하셨어요!</p>
  <button class="btn" onclick="restart()">처음부터 다시 해보기</button>
</div>

<script>
  function setAppHeight(){
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);

  const thread = document.getElementById('thread');
  const taskZone = document.getElementById('taskZone');
  const counter = document.getElementById('counter');
  const app = document.getElementById('app');
  const completeScreen = document.getElementById('completeScreen');

  function addBubble(kind, text, avatar){
    const row = document.createElement('div');
    row.className = 'row ' + kind;
    if (kind === 'system'){
      const b = document.createElement('div');
      b.className = 'bubble system';
      b.textContent = text;
      row.appendChild(b);
    } else {
      if (kind === 'in'){
        const av = document.createElement('div');
        av.className = 'avatar-sm';
        av.textContent = avatar || '🧑‍💼';
        row.appendChild(av);
      }
      const b = document.createElement('div');
      b.className = 'bubble ' + kind;
      b.textContent = text;
      row.appendChild(b);
    }
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }

  // ---- Story steps ----
  // type: 'intro' | 'choice' | 'typing' | 'shortcut'
  const steps = [
    {
      type: 'intro',
      say: '어서 와요! 오늘 첫 출근이죠? 팀장님이 회의록 파일을 보내주셨어요.',
      avatar: '🧑‍💼'
    },
    {
      type: 'choice',
      say: '팀장님이 보낸 "회의록.txt" 파일 안에 뭐가 있는지 확인하려면 어떻게 해야 할까요?',
      avatar: '🧑‍💼',
      options: [
        { text: '파일을 두 번 눌러서(더블클릭) 열어본다', correct: true },
        { text: '파일 이름을 바꾼다', correct: false },
        { text: '파일을 바로 삭제한다', correct: false }
      ],
      correctMsg: '더블클릭해서 파일을 열었어요 📄'
    },
    {
      type: 'typing',
      say: '회의록 맨 위에 오늘 회의 제목을 적어주세요.',
      avatar: '🧑‍💼',
      target: '주간 업무 회의',
      resultMsg: '주간 업무 회의'
    },
    {
      type: 'choice',
      say: '다 작성했어요! 이 내용을 컴퓨터에 안전하게 보관하려면 어떻게 해야 할까요?',
      avatar: '🙋',
      options: [
        { text: 'Ctrl + S를 눌러서 저장한다', correct: true },
        { text: '그냥 창을 닫는다', correct: false },
        { text: '화면을 사진으로 찍어둔다', correct: false }
      ],
      correctMsg: 'Ctrl + S로 저장하는 게 정답이에요!'
    },
    {
      type: 'shortcut',
      say: '맞아요! 그럼 실제로 Ctrl + S를 눌러서 저장해볼까요?',
      avatar: '🙋',
      key: 'S',
      label: '저장하기',
      resultMsg: '(Ctrl + S로 저장함)'
    },
    {
      type: 'shortcut',
      say: '이제 이 내용을 팀장님께도 보내드리게, 먼저 내용을 복사해볼까요? (Ctrl + C)',
      avatar: '🧑‍💼',
      key: 'C',
      label: '복사하기',
      resultMsg: '(Ctrl + C로 복사함)'
    }
  ];

  let stepIndex = 0;
  let activeShortcutHandler = null;

  function clearShortcutHandler(){
    if (activeShortcutHandler){
      document.removeEventListener('keydown', activeShortcutHandler);
      activeShortcutHandler = null;
    }
  }

  function renderStep(){
    counter.textContent = stepIndex + ' / ' + steps.length;
    if (stepIndex >= steps.length){
      finishGame();
      return;
    }
    const step = steps[stepIndex];
    addBubble('in', step.say, step.avatar);
    taskZone.innerHTML = '';

    if (step.type === 'intro'){
      renderContinue();
    } else if (step.type === 'choice'){
      renderChoice(step);
    } else if (step.type === 'typing'){
      renderTyping(step);
    } else if (step.type === 'shortcut'){
      renderShortcut(step);
    }
  }

  function advance(resultMsg){
    if (resultMsg) addBubble('out', resultMsg);
    stepIndex++;
    setTimeout(renderStep, 300);
  }

  function renderContinue(){
    const btn = document.createElement('button');
    btn.className = 'continue-btn';
    btn.textContent = '시작할게요!';
    btn.addEventListener('click', () => advance());
    taskZone.appendChild(btn);
  }

  function renderChoice(step){
    const label = document.createElement('div');
    label.className = 'task-label';
    label.textContent = '알맞은 답을 골라보세요';
    taskZone.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'choice-grid';
    const feedback = document.createElement('div');
    feedback.className = 'feedback';

    step.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = opt.text;
      btn.addEventListener('click', () => {
        if (opt.correct){
          btn.classList.add('correct');
          feedback.textContent = '정답이에요! 👍';
          feedback.classList.remove('wrong');
          Array.from(grid.children).forEach(b => b.disabled = true);
          setTimeout(() => advance(step.correctMsg), 500);
        } else {
          btn.classList.add('wrong');
          feedback.textContent = '다시 한번 생각해볼까요?';
          feedback.classList.add('wrong');
          setTimeout(() => btn.classList.remove('wrong'), 500);
        }
      });
      grid.appendChild(btn);
    });

    taskZone.appendChild(grid);
    taskZone.appendChild(feedback);
  }

  function renderTyping(step){
    const label = document.createElement('div');
    label.className = 'task-label';
    label.textContent = '아래 문장을 그대로 입력해보세요';
    taskZone.appendChild(label);

    const wordDisplay = document.createElement('div');
    wordDisplay.className = 'word-display';
    taskZone.appendChild(wordDisplay);

    const inputRow = document.createElement('div');
    inputRow.className = 'input-row';
    const input = document.createElement('input');
    input.id = 'typeInput';
    input.type = 'text';
    input.autocomplete = 'off';
    input.autocapitalize = 'off';
    input.spellcheck = false;
    input.placeholder = '여기에 입력하세요';
    inputRow.appendChild(input);
    taskZone.appendChild(inputRow);

    function render(){
      const typed = input.value;
      wordDisplay.innerHTML = '';
      for (let i = 0; i < step.target.length; i++){
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = step.target[i];
        if (i < typed.length){
          span.classList.add(typed[i] === step.target[i] ? 'correct' : 'wrong');
        } else if (i === typed.length){
          span.classList.add('current');
        }
        wordDisplay.appendChild(span);
      }
    }

    input.addEventListener('input', () => {
      render();
      if (input.value === step.target){
        input.disabled = true;
        setTimeout(() => advance(step.resultMsg), 300);
      }
    });

    render();
    requestAnimationFrame(() => input.focus());
  }

  function renderShortcut(step){
    const label = document.createElement('div');
    label.className = 'task-label';
    label.textContent = step.label + ' — Ctrl + ' + step.key;
    taskZone.appendChild(label);

    const row = document.createElement('div');
    row.className = 'combo-row';

    const ctrlKey = document.createElement('div');
    ctrlKey.className = 'keycap';
    ctrlKey.textContent = 'Ctrl';

    const plus = document.createElement('div');
    plus.className = 'plus';
    plus.textContent = '+';

    const letterKey = document.createElement('div');
    letterKey.className = 'keycap';
    letterKey.textContent = step.key;

    row.appendChild(ctrlKey);
    row.appendChild(plus);
    row.appendChild(letterKey);
    taskZone.appendChild(row);

    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    taskZone.appendChild(feedback);

    let armed = false;
    let armTimer = null;

    function arm(){
      armed = true;
      ctrlKey.classList.add('armed');
      clearTimeout(armTimer);
      armTimer = setTimeout(() => { armed = false; ctrlKey.classList.remove('armed'); }, 2000);
    }

    function succeed(){
      feedback.textContent = '정확해요! 👍';
      feedback.classList.remove('wrong');
      letterKey.classList.add('pressed');
      clearShortcutHandler();
      setTimeout(() => advance(step.resultMsg), 350);
    }

    ctrlKey.addEventListener('pointerdown', arm);
    letterKey.addEventListener('pointerdown', () => {
      if (armed){
        armed = false;
        ctrlKey.classList.remove('armed');
        succeed();
      } else {
        feedback.textContent = 'Ctrl을 먼저 눌러보세요';
        feedback.classList.add('wrong');
      }
    });

    function onKeydown(e){
      if (e.ctrlKey && e.key && e.key.toUpperCase() === step.key){
        e.preventDefault();
        succeed();
      } else if (e.ctrlKey){
        e.preventDefault();
      }
    }
    clearShortcutHandler();
    activeShortcutHandler = onKeydown;
    document.addEventListener('keydown', onKeydown);
  }

  function finishGame(){
    addBubble('system', '오늘의 미션을 모두 마쳤어요 🎉');
    setTimeout(() => {
      app.classList.add('hidden');
      completeScreen.classList.add('show');
      requestAnimationFrame(() => completeScreen.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }, 500);
  }

  function restart(){
    stepIndex = 0;
    clearShortcutHandler();
    thread.innerHTML = '';
    taskZone.innerHTML = '';
    completeScreen.classList.remove('show');
    app.classList.remove('hidden');
    renderStep();
  }

  renderStep();
</script>

</body>
</html>
